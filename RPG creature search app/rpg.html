<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>RPG Creature Search</title>

  <link rel="stylesheet" href="rpg.css" />
</head>

<body>
  <main class="app">
    <h1>RPG Creature Search</h1>

    <form id="search-form">
      <input
        id="search-input"
        type="text"
        placeholder="Enter creature name or ID"
        required
      />

      <button id="search-button" type="submit">
        Search
      </button>
    </form>

    <section class="creature-card">
      <div class="basic-info">
        <p>
          <span id="creature-name">Search for a creature</span>
          <span id="creature-id"></span>
        </p>

        <p id="weight"></p>
        <p id="height"></p>
      </div>

      <div id="types"></div>

      <div class="stats">
        <div class="stat">
          <span>HP</span>
          <span id="hp">-</span>
        </div>

        <div class="stat">
          <span>Attack</span>
          <span id="attack">-</span>
        </div>

        <div class="stat">
          <span>Defense</span>
          <span id="defense">-</span>
        </div>

        <div class="stat">
          <span>Special Attack</span>
          <span id="special-attack">-</span>
        </div>

        <div class="stat">
          <span>Special Defense</span>
          <span id="special-defense">-</span>
        </div>

        <div class="stat">
          <span>Speed</span>
          <span id="speed">-</span>
        </div>
      </div>
    </section>
  </main>

  <script src="rpg.js"></script>
</body>
</html>
